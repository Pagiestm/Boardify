name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Read release tag
        id: tag
        run: echo "tag=$(git tag --points-at HEAD | head -n 1)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/desktop.yml
    # Transmet les secrets de signature des mises à jour (TAURI_SIGNING_PRIVATE_KEY…).
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.tag }}
