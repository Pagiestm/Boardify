[package]
name = "boardify"
version = "0.0.0"
description = "Boardify, application desktop"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14"
tokio = { version = "1", features = ["time"] }
